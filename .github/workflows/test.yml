name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - ruby: '3.3'
            bundler: 2.5.22
          - ruby: '3.4'
            bundler: 2.6.9
          - ruby: '4.0'
            bundler: 4.0.20
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: ${{ matrix.bundler }}
      - run: ruby test/update_test.rb
        env:
          TEST_BUNDLER: ${{ matrix.bundler }}
