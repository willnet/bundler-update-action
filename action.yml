name: Bundler version update
description: Open a pull request to update the Bundler version recorded in Gemfile.lock.
author: willnet
branding:
  icon: package
  color: red
inputs:
  token:
    description: Token for pushing the update branch and opening the pull request
    default: ${{ github.token }}
  ruby-version:
    description: Ruby version override for ruby/setup-ruby
  bundler-version:
    description: same-major, latest, or a RubyGems version requirement
    default: same-major
  working-directory:
    description: Directory containing Gemfile.lock
    default: .
  branch:
    description: Dedicated pull request branch
    default: bundler-update
  labels:
    description: Comma- or newline-separated pull request labels
outputs:
  updated:
    description: Whether the lockfile was updated
    value: ${{ steps.update.outputs.updated }}
  previous-version:
    description: Original Bundler version
    value: ${{ steps.update.outputs.previous-version }}
  current-version:
    description: Resulting Bundler version
    value: ${{ steps.update.outputs.current-version }}
  pull-request-number:
    description: Pull request number
    value: ${{ steps.pr.outputs.pull-request-number }}
  pull-request-url:
    description: Pull request URL
    value: ${{ steps.pr.outputs.pull-request-url }}
runs:
  using: composite
  steps:
    - shell: bash
      env:
        PROJECT: ${{ inputs.working-directory }}
      run: |
        cd -- "$PROJECT"
        [[ -f Gemfile.lock ]] || { echo "Missing Gemfile.lock in $PROJECT" >&2; exit 1; }
        git ls-files --error-unmatch -- Gemfile.lock >/dev/null
        if ! git diff --quiet -- Gemfile.lock || ! git diff --cached --quiet; then
          echo "Start with a clean index and an unmodified Gemfile.lock" >&2
          exit 1
        fi
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ inputs.ruby-version }}
        working-directory: ${{ inputs.working-directory }}
        bundler: none
    - id: update
      shell: bash
      env:
        PROJECT: ${{ inputs.working-directory }}
        REQUIREMENT: ${{ inputs.bundler-version }}
      run: |
        cd -- "$PROJECT"
        ruby "$GITHUB_ACTION_PATH/scripts/update.rb"
    - id: pr
      uses: peter-evans/create-pull-request@v8
      with:
        token: ${{ inputs.token }}
        branch: ${{ inputs.branch }}
        path: ${{ steps.update.outputs.repository }}
        add-paths: ':(literal)${{ steps.update.outputs.lockfile }}'
        labels: ${{ inputs.labels }}
        title: Bump bundler from ${{ steps.update.outputs.previous-version }} to ${{ steps.update.outputs.current-version }}
        commit-message: Bump bundler from ${{ steps.update.outputs.previous-version }} to ${{ steps.update.outputs.current-version }}
        body: |
          Updates Bundler from ${{ steps.update.outputs.previous-version }} to ${{ steps.update.outputs.current-version }}.

          [Bundler release on RubyGems](https://rubygems.org/gems/bundler/versions/${{ steps.update.outputs.current-version }})

          Generated by [bundler-update-action](https://github.com/willnet/bundler-update-action).
